name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: impyar-backend }
      - uses: actions/checkout@v4
        with: { repository: alirezaworktime-art/impyar-frontend, path: impyar-frontend }
      - uses: actions/checkout@v4
        with: { repository: alirezaworktime-art/impyar-tablet, path: impyar-tablet }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Build and test
        working-directory: impyar-backend
        run: |
          npm install --no-audit --no-fund
          npm test
