# Deploy the staging copy (https://demo.impyar.ir). The server fetches the 'staging' branches of all three repos, builds,
# deploys, checks health and rolls back if unhealthy (ops/staging/deploy-staging.sh).
# Runs on: every push to 'staging' here; every push to 'staging' in impyar-frontend / impyar-tablet (their own small
# workflow calls this one); the Run button. The newest push wins: in the same repo GitHub cancels the older run
# (cancel-in-progress); across repos the server stops the older deploy. The server part runs detached
# (ops/staging/run-deploy.sh), so a cancelled run never leaves staging half-deployed: an older deploy stops at once while
# building, and finishes the short install → restart → health/rollback window first if it is already inside it.
# Pushes with commits that are already live do nothing.
# Needs in the repo that triggers it: secret STAGING_SSH_KEY; variables STAGING_HOST, STAGING_SSH_PORT,
# STAGING_KNOWN_HOSTS, STAGING_URL_HOST.
name: Deploy staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
  workflow_call:
    secrets:
      STAGING_SSH_KEY:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    concurrency:
      group: staging-deploy-${{ github.repository }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Triggered by
        run: echo "${{ github.repository }} ${{ github.event_name }} ${{ github.ref_name }} ${{ github.sha }}"
      - name: SSH setup
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ vars.STAGING_HOST }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          KNOWN: ${{ vars.STAGING_KNOWN_HOSTS }}
        run: |
          [ -n "$KEY" ] || { echo "secret STAGING_SSH_KEY is missing in ${{ github.repository }}"; exit 1; }
          [ -n "$HOST" ] && [ -n "$PORT" ] && [ -n "$KNOWN" ] || { echo "variables STAGING_HOST / STAGING_SSH_PORT / STAGING_KNOWN_HOSTS are missing in ${{ github.repository }}"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/staging_key; chmod 600 ~/.ssh/staging_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host stg\n  HostName %s\n  Port %s\n  User root\n  IdentityFile ~/.ssh/staging_key\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 30\n  ServerAliveInterval 30\n' "$HOST" "$PORT" > ~/.ssh/config
      - uses: actions/checkout@v4
        with: { repository: alirezaworktime-art/impyar-backend, ref: staging, path: impyar-backend }
      - name: Deploy on the staging server
        run: |
          set -euo pipefail
          for f in deploy-staging.sh run-deploy.sh; do
            [ -s impyar-backend/ops/staging/$f ] || { echo "impyar-backend 'staging' has no ops/staging/$f — merge impyar-backend main into staging first"; exit 1; }
            tr -d '\r' < impyar-backend/ops/staging/$f | ssh stg "cat > /opt/implant-staging/run/$f.new && [ -s /opt/implant-staging/run/$f.new ] && mv /opt/implant-staging/run/$f.new /opt/implant-staging/run/$f"
          done
          ssh stg "bash /opt/implant-staging/run/run-deploy.sh ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.repository.name }}"
      - name: Check from outside
        env:
          URL_HOST: ${{ vars.STAGING_URL_HOST }}
        run: |
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://$URL_HOST/"); echo "https://$URL_HOST/ → $code"
          curl -s -m 30 "https://$URL_HOST/" | grep -oE -- '---------- stg-[0-9a-f]+ \(' | head -1
          [ "$code" = 200 ]
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/staging_key
